# LoadMatch — Netlify config
# Netlify serves HTTPS and redirects http→https automatically when
# "Force HTTPS" is enabled in Site settings → Domain management,
# so no manual http→https redirect rule is needed here.

[build]
  publish = "."

# Custom 404 (Netlify uses 404.html automatically, this is explicit)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
